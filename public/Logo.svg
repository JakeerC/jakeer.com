<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
<!--Outer Container Drop Shadow-->
  <rect x="52" y="52" width="400" height="400" fill="#000000"/>
<!--Main Canvas Box-->
  <rect x="36" y="36" width="400" height="400" fill="#fff9f0" stroke="#000000" stroke-width="12" stroke-linejoin="miter"/>
<!--Background Grid Lines (4x4 Matrix)-->
  <g stroke="#9CA300" stroke-width="2">
<!--Vertical Grid Lines-->
    <line x1="116" y1="86" x2="116" y2="386"/>
    <line x1="196" y1="86" x2="196" y2="386"/>
    <line x1="276" y1="86" x2="276" y2="386"/>
    <line x1="356" y1="86" x2="356" y2="386"/>
<!--Horizontal Grid Lines-->
    <line x1="86" y1="161" x2="386" y2="161"/>
    <line x1="86" y1="236" x2="386" y2="236"/>
    <line x1="86" y1="311" x2="386" y2="311"/>
  </g>
<!--Top-Right Magenta Accent Box-->
  <g>
<!--Accent Shadow-->
    <rect x="372" y="24" width="84" height="74" fill="#000000"/>
<!--Accent Fill & Border-->
    <rect x="364" y="16" width="84" height="74" fill="#FF00CC" stroke="#000000" stroke-width="8"/>
  </g>
<!--"cj" Monospace Letterform Group-->
  <g transform="translate(90, 95)">
<!--1. Hard Drop Shadow Layer-->
    <text x="18" y="235" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="240" font-weight="900" fill="#000000" letter-spacing="-16">cj</text>
<!--2. Outer White Cutout Border Layer-->
    <text x="0" y="215" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="240" font-weight="900" fill="#000000" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="miter" stroke-linecap="square" letter-spacing="-16">cj</text>
<!--3. Inner Solid Black Foreground Fill-->
    <text x="0" y="215" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="240" font-weight="900" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square" letter-spacing="-16">cj</text>
  </g>
<!--Bottom-Left Mint Green Plus Badge-->
  <g transform="translate(56, 350)">
<!--Plus Shadow-->
    <path d="M 28 0 H 60 V 28 H 88 V 60 H 60 V 88 H 28 V 60 H 0 V 28 H 28 Z" fill="#000000"/>
<!--Plus Main-->
    <path d="M 20 -8 H 52 V 20 H 80 V 52 H 52 V 80 H 20 V 52 H -8 V 20 H 20 Z" fill="#88F3B3" stroke="#000000" stroke-width="8" stroke-linejoin="miter"/>
  </g>
<!--Bottom-Right Blue ".sh" Pill Badge-->
  <g transform="translate(320, 370)">
<!--Pill Shadow-->
    <rect x="8" y="8" width="105" height="44" rx="22" fill="#000000"/>
<!--Pill Main-->
    <rect x="0" y="0" width="105" height="44" rx="22" fill="#0044FF" stroke="#000000" stroke-width="7"/>
<!--Pill Text-->
    <text x="52.5" y="29" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">.sh</text>
  </g>
</svg>
